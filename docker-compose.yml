version: '3.8'

services:
  # PostgreSQL 数据库
  database:
    image: postgres:16-alpine
    container_name: clawswarm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clawswarm_secure_password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clawswarm-network

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawswarm-backend
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-clawswarm_secure_password}@database:5432/postgres
      # 应用配置
      CLAWSWARM_BASE_URL: ${CLAWSWARM_BASE_URL:-http://localhost}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # Headscale/Tailscale 配置
      HEADSCALE_URL: ${HEADSCALE_URL:-}
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      TAILSCALE_AUTH_KEY: ${TAILSCALE_AUTH_KEY:-}
      # 日志配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scheduler-server/src:/app/src:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - clawswarm-network

  # 前端 (Nginx)
  frontend:
    image: nginx:alpine
    container_name: clawswarm-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web-client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - clawswarm-network
    restart: unless-stopped

  # Tailscale 客户端 (可选，需要特权)
  # 取消注释以下内容以启用 Tailscale
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: clawswarm-tailscale
  #   environment:
  #     TS_USERSPACE: "false"
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_AUTH_KEY: ${TAILSCALE_AUTH_KEY}
  #     TS_EXTRA_ARGS: "--accept-dns=false"
  #   volumes:
  #     - tailscale_state:/var/lib/tailscale
  #   cap_add:
  #     - NET_ADMIN
  #   network_mode: "host
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  tailscale_state:
    driver: local

networks:
  clawswarm-network:
    driver: bridge
